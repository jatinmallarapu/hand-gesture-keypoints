[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hand-gesture-keypoints"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2", "fastapi>=0.115,<1",
                "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pyyaml>=6,<7"]
[project.optional-dependencies]
video = ["mediapipe>=0.10.21,<0.11", "opencv-python>=4.10,<5"]
torch = ["torch>=2.5,<3", "onnx>=1.17,<2", "onnxruntime>=1.20,<2"]
jax = ["jax[cpu]>=0.5,<0.9", "flax>=0.10,<0.13", "optax>=0.2.4,<0.3"]
analysis = ["matplotlib>=3.9,<4", "jupyter>=1.1,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
where = ["src", "."]
include = ["handgest", "api"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
